<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Training Log</title>
</head>
<body>
    <h1>Training Log</h1>
    <button id="logout-button">Log out</button>

    <form id="entry-form">
        <label>Date <input type="date" name="date" required></label>
        <label>Distance (km) <input type="number" step="0.01" min="0" name="distance_km" required></label>
        <label>Duration (min) <input type="number" step="1" min="0" name="duration_min" required></label>
        <label>Notes <input type="text" name="notes"></label>
        <button type="submit">Add entry</button>
    </form>
    <p id="error" style="color: red;"></p>

    <h2>Entries</h2>
    <table border="1" cellpadding="4">
        <thead>
        <tr>
            <th>Date</th>
            <th>Distance (km)</th>
            <th>Duration (min)</th>
            <th>Notes</th>
        </tr>
        </thead>
        <tbody id="entries-body"></tbody>
    </table>

    <script>
        document.getElementById("logout-button").addEventListener("click", async () => {
            await fetch("/logout", { method: "POST" });
            window.location.href = "/login";
        });

        async function loadEntries() {
            const res = await fetch("/api/entries");
            if (res.status === 401) {
                window.location.href = "/login";
                return;
            }
            const entries = await res.json();
            const body = document.getElementById("entries-body");
            body.innerHTML = "";
            for (const entry of entries) {
                const row = document.createElement("tr");
                for (const value of [entry.date, entry.distance_km, entry.duration_min, entry.notes]) {
                    const cell = document.createElement("td");
                    cell.textContent = value;
                    row.appendChild(cell);
                }
                body.appendChild(row);
            }
        }

        document.getElementById("entry-form").addEventListener("submit", async (event) => {
            event.preventDefault();
            const form = event.target;
            const errorEl = document.getElementById("error");
            errorEl.textContent = "";

            const payload = {
                date: form.date.value,
                distance_km: parseFloat(form.distance_km.value),
                duration_min: parseFloat(form.duration_min.value),
                notes: form.notes.value,
            };

            const res = await fetch("/api/entries", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload),
            });

            if (res.status === 401) {
                window.location.href = "/login";
                return;
            }
            if (!res.ok) {
                const body = await res.json();
                errorEl.textContent = "Error: " + JSON.stringify(body.detail);
                return;
            }

            form.reset();
            loadEntries();
        });

        loadEntries();
    </script>
</body>
</html>
