apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: simpleapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: simpleapp
  template:
    metadata:
      labels:
        app: simpleapp
    spec:
      containers:
        - name: app
          image: simpleapp:k8s-test
          # Not pulled from a registry — loaded straight into kind's node for local
          # testing (`kind load docker-image`). A real cluster needs a real registry
          # (ECR/GCR/Docker Hub/etc.) and imagePullPolicy: IfNotPresent or Always.
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: simpleapp-secrets
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: simpleapp
spec:
  selector:
    app: simpleapp
  ports:
    - port: 8000
      targetPort: 8000
