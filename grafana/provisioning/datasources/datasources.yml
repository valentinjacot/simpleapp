apiVersion: 1

datasources:
  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    uid: tempo
    jsonData:
      # Lets a trace's "Logs" button in Grafana jump straight to its logs in
      # Loki, using the shared service.name (Loki's "service_name" label) —
      # the same resource attribute Tempo, Loki, and Elastic APM all carry.
      tracesToLogsV2:
        datasourceUid: loki
        tags: [{ key: "service.name", value: "service_name" }]
        filterByTraceID: true
        filterBySpanID: false

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    uid: loki

  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    uid: prometheus
    isDefault: true
