services:
  db:
    image: postgres:14
    environment:
      POSTGRES_USER: simpleapp
      POSTGRES_PASSWORD: simpleapp_dev
      POSTGRES_DB: simpleapp
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simpleapp"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://simpleapp:simpleapp_dev@db/simpleapp
    command: ["alembic", "upgrade", "head"]

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+psycopg2://simpleapp:simpleapp_dev@db/simpleapp
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY}
      APP_USERNAME: ${APP_USERNAME}
      APP_PASSWORD_HASH: ${APP_PASSWORD_HASH}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      # Standard OTel env var — merges into the SDK's Resource alongside the
      # service.name already set in code (otel_setup.py/logging_config.py), no
      # code change needed. This is a collector/config-layer concern, not an
      # instrumentation one: every backend downstream sees the same three attrs.
      OTEL_RESOURCE_ATTRIBUTES: "service.version=0.1.0,deployment.environment=development"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
    ports:
      - "9200:9200"

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "5601:5601"

  apm-server:
    image: docker.elastic.co/apm/apm-server:8.15.3
    command: >
      apm-server -e
        -E apm-server.host=0.0.0.0:8200
        -E apm-server.auth.anonymous.enabled=true
        -E output.elasticsearch.hosts=["elasticsearch:9200"]
        -E apm-server.kibana.enabled=true
        -E apm-server.kibana.host=http://kibana:5601
        -E setup.kibana.host=http://kibana:5601
    depends_on:
      elasticsearch:
        condition: service_healthy
      kibana:
        condition: service_started
    ports:
      - "8200:8200"

  # --- Grafana stack: fans out the SAME collector-received telemetry to a second,
  # independent set of backends. None of these change anything upstream of the
  # collector — the app's instrumentation code is untouched.
  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - tempodata:/var/tempo
    ports:
      - "3200:3200"

  loki:
    image: grafana/loki:3.2.1
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - lokidata:/loki
    ports:
      - "3100:3100"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.113.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
      apm-server:
        condition: service_started
      tempo:
        condition: service_started
      loki:
        condition: service_started
    ports:
      - "4318:4318"
      - "8889:8889"

  prometheus:
    image: prom/prometheus:v2.55.1
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    depends_on:
      otel-collector:
        condition: service_started
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.2.2
    environment:
      # No login wall for local learning — matches xpack.security.enabled: false
      # on Elasticsearch and apm-server.auth.anonymous.enabled=true elsewhere in
      # this stack. Not for anything beyond local dev.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      tempo:
        condition: service_started
      loki:
        condition: service_started
      prometheus:
        condition: service_started
    ports:
      - "3000:3000"

volumes:
  pgdata:
  esdata:
  tempodata:
  lokidata:
  promdata:
  grafanadata:
