receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  # Routed through Elastic's own APM Server, not the generic `elasticsearch`
  # exporter — APM Server maps OTel data into Elastic's proper APM data model
  # (what Kibana's APM UI actually reads), sidestepping the `mapping: mode: otel`
  # bug found in the `elasticsearch` exporter (see CLAUDE.md's Step C follow-up).
  otlphttp/elastic:
    endpoint: http://apm-server:8200
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/elastic, debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/elastic, debug]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/elastic, debug]
