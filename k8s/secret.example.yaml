# Documents the two Secrets' expected shape — not applied directly (no real values).
# Same pattern as .env.example: commit the shape, never the values. Split in two so
# each container only gets the credentials it actually needs (least privilege) — the
# Postgres container has no business seeing APP_PASSWORD_HASH, for example.
#
# Create the real Secrets with:
#   kubectl create secret generic postgres-credentials -n simpleapp \
#     --from-literal=POSTGRES_USER=simpleapp \
#     --from-literal=POSTGRES_PASSWORD=simpleapp_dev \
#     --from-literal=POSTGRES_DB=simpleapp
#
#   kubectl create secret generic simpleapp-secrets -n simpleapp \
#     --from-literal=DATABASE_URL=postgresql+psycopg2://simpleapp:simpleapp_dev@db/simpleapp \
#     --from-literal=SESSION_SECRET_KEY=<python3 -c "import secrets; print(secrets.token_urlsafe(32))"> \
#     --from-literal=APP_USERNAME=<your username> \
#     --from-literal=APP_PASSWORD_HASH=<.venv/bin/python scripts/hash_password.py>
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: simpleapp
type: Opaque
stringData:
  POSTGRES_USER: ""
  POSTGRES_PASSWORD: ""
  POSTGRES_DB: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: simpleapp-secrets
  namespace: simpleapp
type: Opaque
stringData:
  DATABASE_URL: ""
  SESSION_SECRET_KEY: ""
  APP_USERNAME: ""
  APP_PASSWORD_HASH: ""
